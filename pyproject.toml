[project]
name = "pyconlab"
version = "0.1.0"
description = "A Python concurrency lab with pure-Python matrix multiplication"
readme = "README.md"
authors = [
    { name = "Quan Hua", email = "quanhua92@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
pyconlab = "pyconlab.cli:main"
async_server = "pyconlab.async_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]
